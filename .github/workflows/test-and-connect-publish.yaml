name: test-and-connect-publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  test-and-connect-publish:
    runs-on: ubuntu-22.04
    outputs:
      output1: ${{ steps.test.outputs.test }}
      dir: ${{ steps.publish.outputs.dir }}
      url: ${{ steps.publish.outputs.url }}
      id: ${{ steps.publish.outputs.id }}
      success: ${{ steps.publish.outputs.success }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'      
      - name: Install dependencies
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        #     uv sync
        #     python -m pip install --upgrade pip
        #     python -m pip install -r requirements.txt

      - name: Ensure playwright and browsers are installed
        run: |
          python -m pip install playwright pytest pytest-playwright
          python -m playwright install --with-deps
          uv tool install rsconnect-python

      - name: Test Shiny App
        run: pytest
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: tests/

      - name: Create manifest.json
        id: test
        run: |
          rsconnect write-manifest shiny . --overwrite
          echo "test=hello" >> "$GITHUB_OUTPUT"

      - name: Publish Connect content
        uses: rstudio/actions/connect-publish@main
        id: publish
        with:
          url: ${{ secrets.CONNECT_SERVER }}
          api-key: ${{ secrets.CONNECT_API_KEY }}
          access-type: logged_in
          force: true
          dir: |
            .:/python-shiny-app-demo-cicd-github-actions
      - run: printf '${{ steps.publish.outputs.results }}\n' | jq .
      - run: printf '${{ steps.publish.outputs.results }}' | jq '.[0].id'

      - name: Update meta data 
        run: |
          # The output from a previous step, likely a JSON string
          RESULTS_JSON='${{ steps.publish.outputs.results }}'
          
          # Parse the JSON string to get the content ID
          CONTENT_ID=$(echo "$RESULTS_JSON" | jq '.[0].id')

          # Get the content GUID
          CONTENT_NAME='python-shiny-app-demo-cicd-github-actions'
          CONTENT_GUID=$(curl -H "Authorization: KEY ${{ secrets.CONNECT_API_KEY }}" ${{ secrets.CONNECT_SERVER }}/__api__/v1/v1/content?name=${CONTENT_NAME} | jq -r '.[].guid')

          echo "Content GUID: $CONTENT_GUID"

          # Update the content metadata
          DATA='{"title": "Python CICD with pytest and Playwright using Github actions"}'
          curl --silent --show-error -L --max-redirs 0 --fail \
            -X PATCH \
            -H "Authorization: Key ${{ secrets.CONNECT_API_KEY }}" \
            --data-raw "${DATA}" \
            "${{ secrets.CONNECT_SERVER }}/__api__/v1/content/${CONTENT_GUID}"


          export CONTENT_ID='${{ steps.publish.outputs.results }}' | jq '.[0].id'
          CONTENT_ID=$(echo "$RESULTS_JSON" | jq '.[0].id')
          export CONTENT_NAME='python-shiny-app-demo-cicd-github-actions'
          export CONTENT_GUID=$(curl -H "Authorization: KEY ${{ secrets.CONNECT_API_KEY }}" ${{ secrets.CONNECT_SERVER }}/__api__/v1/content?name=${CONTENT_NAME} | jq -r '.[].guid')
          echo $CONTENT_GUID
          export DATA='{"title": "Python CICD with pytest and Playwright using Github actions"}'
          curl --silent --show-error -L --max-redirs 0 --fail \
            -X PATCH \
            -H "Authorization: Key ${{ secrets.CONNECT_API_KEY }}" \
            --data-raw "${DATA}" \
            "${{ secrets.CONNECT_SERVER }}__api__/v1/content/${CONTENT_GUID}"

        
        # Longer term wouldn't it be great if the Connect github action returned the guid for us - https://github.com/rstudio/actions/tree/main/connect-publish

        #  We could use any of the supported API data fields: https://docs.posit.co/connect/api/#patch-/v1/content/-guid-

