name: test-and-connect-publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  test-and-connect-publish:
    runs-on: ubuntu-22.04
    outputs:
      dir: ${{ steps.publish.outputs.dir }}
      url: ${{ steps.publish.outputs.url }}
      id: ${{ steps.publish.outputs.id }}
      success: ${{ steps.publish.outputs.success }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'      
      - name: Install dependencies
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
           python -m pip install --upgrade pip
           python -m pip install -r requirements.txt
        #     uv sync
        #     python -m pip install --upgrade pip
        #     python -m pip install -r requirements.txt

      - name: Ensure playwright and browsers are installed
        run: |
          python -m pip install playwright pytest pytest-playwright rsconnect
          python -m playwright install --with-deps

      - name: Test Shiny App
        run: pytest
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: tests/

      - name: Create manifest.json
        run: |
          rsconnect write-manifest shiny . --overwrite

      - name: Publish Connect content
        uses: rstudio/actions/connect-publish@main
        id: publish
        with:
          url: ${{ secrets.CONNECT_SERVER }}
          api-key: ${{ secrets.CONNECT_API_KEY }}
          access-type: logged_in
          force: true
          dir: |
            .:/python-shiny-app-demo-cicd-github-actions

      - name: Check outputs
        run: |
          echo "$dir"
          echo "$url"
          echo "$id"
          echo "$success"

      - name: Update meta data 
        run: |
          export DATA='{"title": "Python CICD with pytest/Playwright using Github actions"}'
          export CONTENT_NAME='python-shiny-app-demo-cicd-github-actions'
          export contentguid=$(curl -H "Authorization: KEY ${{ secrets.CONNECT_API_KEY }}" ${{ secrets.CONNECT_SERVER }}/__api__/v1/content?name=${CONTENT_NAME} | jq -r '.[].guid')
          echo contentguid
          curl --silent --show-error -L --max-redirs 0 --fail -X PATCH -H "Authorization: Key ${{ secrets.CONNECT_API_KEY }}" --data "${DATA}" "${{ secrets.CONNECT_SERVER }}__api__/v1/content/${contentguid}"

        # - name: Use Connect API to set content title
        #   run: |
        #     export DATA='{"title": "Building diagrams using in reports"}'
        #     export CONTENT_NAME='report-mermaid-diagrams'
        #     export contentguid=$(curl -H "Authorization: KEY ${{ secrets.CONNECT_API_KEY }}" ${{ secrets.CONNECT_SERVER }}/__api__/v1/content?name=${CONTENT_NAME} | jq -r '.[].guid')
        #     echo contentguid
        #     curl --silent --show-error -L --max-redirs 0 --fail -X PATCH -H "Authorization: Key ${{ secrets.CONNECT_API_KEY }}" --data "${DATA}" "${{ secrets.CONNECT_SERVER }}__api__/v1/content/${contentguid}"
